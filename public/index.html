  <script id="app-base-bootstrap">
    (() => {
      const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
      const pathname = window.location.pathname || '/';
      const looksLikeFile = /\/[^/]+\.[^/]+$/.test(pathname);
      let basePath = '';

      if (isHttp) {
        basePath = looksLikeFile
          ? pathname.slice(0, pathname.lastIndexOf('/'))
          : pathname.replace(/\/+$/, '');
        if (basePath === '/') basePath = '';

        const base = document.createElement('base');
        base.href = window.location.origin + basePath + '/';
        document.head.appendChild(base);
      }

      const withBasePath = (value) => {
        if (!basePath || typeof value !== 'string' || !value.startsWith('/') || value.startsWith('//')) {
          return value;
        }
        if (value === basePath || value.startsWith(basePath + '/')) {
          return value;
        }
        return basePath + value;
      };

      window.__PROTOCLAW_BASE_PATH__ = basePath;
      window.__PROTOCLAW_APP_URL__ = withBasePath;

      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        if (typeof input === 'string') {
          return nativeFetch(withBasePath(input), init);
        }
        if (typeof Request !== 'undefined' && input instanceof Request) {
          const url = new URL(input.url, window.location.href);
          if (url.origin === window.location.origin) {
            const nextPath = withBasePath(url.pathname);
            if (nextPath !== url.pathname) {
              url.pathname = nextPath;
              return nativeFetch(new Request(url.toString(), input), init);
            }
          }
        }
        return nativeFetch(input, init);
      };
    })();
  </script>

  <script>
    // highlight.js 加载失败时的兜底：必须转义，否则工具结果中的源码
    // 会被当作 HTML 解析，破坏消息列表结构（未闭合标签吞掉后续消息行）
    window.hljs = window.hljs || {
      getLanguage() { return false; },
      highlight(code) { return { value: escapeHtmlLite(code) }; },
      highlightAuto(code) { return { value: escapeHtmlLite(code) }; }
    };
    function escapeHtmlLite(text) {
      return String(text ?? '').replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
  </script>
